[project]
name = "agentglow"
version = "0.1.0"
description = "Live 3D views of agent systems, driven only by OpenTelemetry spans"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["opentelemetry", "agents", "observability", "langgraph", "deepagents", "openai-agents", "visualization"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-proto>=1.25",
  "protobuf>=4.21",
  "httpx>=0.27",
]

[project.optional-dependencies]
langchain = ["openinference-instrumentation-langchain>=0.1.30"]
openai-agents = ["openinference-instrumentation-openai-agents>=1.0"]
hatchet = ["hatchet-sdk[otel]>=1.0"]
falkordb = ["falkordb>=1.0"]
# backend services (docs/SPEC.md "Backend services"): agentglow.watch(app=...) / watch(broker=...) / watch(mcp=...)
fastapi = ["opentelemetry-instrumentation-fastapi>=0.45b0", "opentelemetry-instrumentation-httpx>=0.45b0",
           "opentelemetry-instrumentation-requests>=0.45b0"]
faststream = ["faststream[otel]>=0.5"]
redis = ["opentelemetry-instrumentation-redis>=0.45b0"]
postgres = ["opentelemetry-instrumentation-asyncpg>=0.45b0"]
mongodb = ["opentelemetry-instrumentation-pymongo>=0.45b0"]
mcp = ["mcp>=1.9", "openinference-instrumentation-mcp>=1.0"]

[project.scripts]
agentglow = "agentglow.cli:main"

[project.urls]
Homepage = "https://github.com/Nideesh1/agentglow"

[dependency-groups]
dev = [
  "pytest>=8",
  "deepagents; python_version >= '3.11'",
  "langchain-google-genai; python_version >= '3.11'",
  "openinference-instrumentation-langchain",
  "python-dotenv",
  "agentglow[fastapi,faststream,redis,mcp]",
  "faststream[redis]>=0.5",
  "redis>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentglow"]
# static/ is filled by the frontend build and may be git-ignored: include it explicitly
artifacts = ["agentglow/static/**"]

[tool.hatch.build.targets.sdist]
include = ["agentglow", "README.md", "pyproject.toml"]
artifacts = ["agentglow/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
