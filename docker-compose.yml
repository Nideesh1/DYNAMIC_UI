# AgentGlow + the deepagents-hatchet example stack.
#
#   cp .env.example .env   # + one LLM key (GEMINI_API_KEY / OPENAI_API_KEY / ANTHROPIC_API_KEY, AGENT_MODEL to match)
#   docker compose up -d --build                                  # agentglow, falkordb, hatchet, mcp servers, worker, trigger
#   open http://localhost:8101                                    # 3D scenes
#   docker compose exec worker uv run python trigger.py "Why is churn rising for Acme Corp?"
#   docker compose exec worker uv run python trigger.py --incident   # incident triage demo (see the example README)
#   docker compose exec worker uv run python trigger.py --vendor     # long-running vendor consolidation demo, then:
#   curl -X POST localhost:8300/approve                               # approve it (or: trigger.py --approve)
#   docker compose exec worker uv run python trigger.py --desk       # paper trading desk (fast Jev gates, deepagents analyst)
#   ./scripts/gen-obs-env.sh   # only for the langfuse profile: generates its local secrets into .env
#   LANGFUSE_EXPORT=1 docker compose --profile langfuse up -d     # + Langfuse at :3100 (same spans, side by side)
#
# Ports avoid the BOOKIE stack: agentglow :8101, Hatchet UI :8180, Hatchet gRPC :7177, Langfuse :3100.

services:
  # ------------------------------------------------------------------ visualizer
  agentglow:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8101:8100"]   # host 8101: 8100 is left for `npx agentglow setup` (Claude Code)
    environment:
      AGENTGLOW_FALKOR_URL: redis://falkordb:6379
      AGENTGLOW_RUN_WEBHOOK: http://trigger:8300/run   # "▶ Run agents" in the UI → the example's trigger service
      AGENTGLOW_INGEST_KEY: ${AGENTGLOW_INGEST_KEY:-}  # empty (default) = open ingest; see .env.example
    depends_on: [falkordb]
    restart: unless-stopped

  # ------------------------------------------------------------------ example: graph DB
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"   # graph (redis protocol)
      - "3000:3000"   # FalkorDB browser UI
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    restart: unless-stopped

  # ------------------------------------------------------------------ example: MCP server + Hatchet worker
  mcp:          # `analytics` MCP server (streamable HTTP :8200/mcp) → Snowflake / Spark / Postgres (simulated)
    image: agentglow-example-deepagents-hatchet:local
    build: &example-build
      context: .
      dockerfile: examples/deepagents-hatchet/Dockerfile
    command: ["uv", "run", "python", "-m", "app.mcp_server"]
    environment:
      AGENTGLOW_URL: http://agentglow:8100
      AGENTGLOW_API_KEY: ${AGENTGLOW_INGEST_KEY:-}
    depends_on: [agentglow]
    restart: unless-stopped

  mcp_obs:      # `observability` MCP server (:8201/mcp) → Loki / Prometheus / PagerDuty (simulated), incident demo
    image: agentglow-example-deepagents-hatchet:local
    build: *example-build
    command: ["uv", "run", "python", "-m", "app.obs_mcp_server"]
    environment:
      AGENTGLOW_URL: http://agentglow:8100
      AGENTGLOW_API_KEY: ${AGENTGLOW_INGEST_KEY:-}
    depends_on: [agentglow]
    restart: unless-stopped

  mcp_github:   # `github` MCP server (:8202/mcp) → GitHub API (simulated), incident demo
    image: agentglow-example-deepagents-hatchet:local
    build: *example-build
    command: ["uv", "run", "python", "-m", "app.github_mcp_server"]
    environment:
      AGENTGLOW_URL: http://agentglow:8100
      AGENTGLOW_API_KEY: ${AGENTGLOW_INGEST_KEY:-}
    depends_on: [agentglow]
    restart: unless-stopped

  mcp_erp:      # `erp` MCP server (:8203/mcp) → SAP / Coupa (simulated), vendor consolidation demo
    image: agentglow-example-deepagents-hatchet:local
    build: *example-build
    command: ["uv", "run", "python", "-m", "app.erp_mcp_server"]
    environment:
      AGENTGLOW_URL: http://agentglow:8100
      AGENTGLOW_API_KEY: ${AGENTGLOW_INGEST_KEY:-}
    depends_on: [agentglow]
    restart: unless-stopped

  mcp_email:    # `email` MCP server (:8204/mcp) → Exchange (simulated), vendor consolidation demo
    image: agentglow-example-deepagents-hatchet:local
    build: *example-build
    command: ["uv", "run", "python", "-m", "app.email_mcp_server"]
    environment:
      AGENTGLOW_URL: http://agentglow:8100
      AGENTGLOW_API_KEY: ${AGENTGLOW_INGEST_KEY:-}
    depends_on: [agentglow]
    restart: unless-stopped

  worker:       # Hatchet worker running the deepagents workflows `agent_smoke`, `incident_triage`, `vendor_consolidation`, `trading_desk`
    image: agentglow-example-deepagents-hatchet:local
    build: *example-build
    command: ["uv", "run", "python", "-m", "app.worker"]
    environment:
      AGENTGLOW_URL: http://agentglow:8100
      AGENTGLOW_API_KEY: ${AGENTGLOW_INGEST_KEY:-}
      MCP_URL: http://mcp:8200/mcp
      OBS_MCP_URL: http://mcp_obs:8201/mcp
      GITHUB_MCP_URL: http://mcp_github:8202/mcp
      ERP_MCP_URL: http://mcp_erp:8203/mcp
      EMAIL_MCP_URL: http://mcp_email:8204/mcp
      DEMO_SLEEP_S: ${DEMO_SLEEP_S:-20}                 # vendor demo: durable sleep between negotiation rounds
      APPROVAL_TIMEOUT_S: ${APPROVAL_TIMEOUT_S:-1800}   # vendor demo: auto-approve after 30 min
      # trading desk demo (paper only, see the example README): session size, analyst cooldown, human gate, Jev cap
      DESK_MARKETS: ${DESK_MARKETS:-12}
      DESK_TICKS: ${DESK_TICKS:-60}
      DESK_TICK_S: ${DESK_TICK_S:-1.0}
      DESK_THINK_COOLDOWN_S: ${DESK_THINK_COOLDOWN_S:-30}
      DESK_MAX_ANALYSTS: ${DESK_MAX_ANALYSTS:-3}
      DESK_HUMAN_TIMEOUT_S: ${DESK_HUMAN_TIMEOUT_S:-8}
      DESK_OUTAGE_EVERY_S: ${DESK_OUTAGE_EVERY_S:-45}
      JEV_MAX_RPS: ${JEV_MAX_RPS:-5}                    # hard cap on real Jev requests/s; overflow -> local jev-sim
      FALKOR_HOST: falkordb
      AGENT_MODEL: ${AGENT_MODEL:-google_genai:gemini-3.8-flash}   # provider:model (google_genai / openai / anthropic)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Amazon Bedrock Mantle (AGENT_MODEL=bedrock_mantle_openai:... / bedrock_mantle_anthropic:...): a Bedrock API key
      # or standard AWS credentials; AWS_REGION picks the endpoint (default us-east-1)
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # decisions (app/decide.py): TypeSafe Jev when set, else an LLM judge (DECIDE_MODEL, default AGENT_MODEL)
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      DECIDE_MODEL: ${DECIDE_MODEL:-}
      ROUTER_SMALL_MODEL: ${ROUTER_SMALL_MODEL:-}   # vendor router "small" route (default per provider, see app/vendor.py)
      DEMO_FORCE_FIRST_REVIEW_FAIL: ${DEMO_FORCE_FIRST_REVIEW_FAIL:-1}   # incident: reject review attempt 1 → one retry
      OBS_LANGFUSE_PUBLIC_KEY: ${OBS_LANGFUSE_PUBLIC_KEY:-}
      OBS_LANGFUSE_SECRET_KEY: ${OBS_LANGFUSE_SECRET_KEY:-}
      LANGFUSE_EXPORT: ${LANGFUSE_EXPORT:-0}
    volumes: [obs_hatchet_token:/hatchet-token:ro]
    depends_on:
      agentglow: {condition: service_started}
      falkordb: {condition: service_started}
      mcp: {condition: service_started}
      mcp_obs: {condition: service_started}
      mcp_github: {condition: service_started}
      mcp_erp: {condition: service_started}
      mcp_email: {condition: service_started}
      obs_hatchet_engine: {condition: service_started}
      obs_hatchet_token: {condition: service_completed_successfully}
    restart: unless-stopped

  trigger:      # HTTP trigger (POST :8300/run {topic, workflow?} → agent_smoke / incident_triage / vendor_consolidation / trading_desk run; POST :8300/approve); agentglow's POST /live/run forwards here
    image: agentglow-example-deepagents-hatchet:local
    build: *example-build
    command: ["uv", "run", "python", "-m", "app.trigger_api"]
    ports: ["127.0.0.1:8300:8300"]   # host: curl -X POST localhost:8300/approve (vendor demo)
    volumes: [obs_hatchet_token:/hatchet-token:ro]   # Hatchet API token, read automatically by app/config.py
    depends_on:
      obs_hatchet_engine: {condition: service_started}
      obs_hatchet_token: {condition: service_completed_successfully}
    restart: unless-stopped

  # ------------------------------------------------------------------ Hatchet (orchestration)
  obs_postgres:     # Hatchet's database (Langfuse also uses it under the langfuse profile)
    image: postgres:15.6
    command: postgres -c 'max_connections=500'
    restart: unless-stopped
    environment: [POSTGRES_USER=hatchet, POSTGRES_PASSWORD=hatchet, POSTGRES_DB=hatchet]
    volumes: [obs_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d hatchet -U hatchet"]
      interval: 5s
      timeout: 5s
      retries: 20

  obs_hatchet_migrate:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-migrate:latest
    command: /hatchet/hatchet-migrate
    environment:
      DATABASE_URL: "postgres://hatchet:hatchet@obs_postgres:5432/hatchet"
    depends_on:
      obs_postgres: {condition: service_healthy}

  obs_hatchet_config:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-admin:latest
    command: /hatchet/hatchet-admin quickstart --skip certs --generated-config-dir /hatchet/config --overwrite=false
    environment:
      DATABASE_URL: "postgres://hatchet:hatchet@obs_postgres:5432/hatchet"
      SERVER_MSGQUEUE_KIND: postgres
      SERVER_AUTH_COOKIE_DOMAIN: localhost:8180
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_INSECURE: "t"
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:7177
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: obs_hatchet_engine:7070
    volumes: [obs_hatchet_certs:/hatchet/certs, obs_hatchet_config:/hatchet/config]
    depends_on:
      obs_hatchet_migrate: {condition: service_completed_successfully}

  obs_hatchet_engine:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-engine:latest
    command: /hatchet/hatchet-engine --config /hatchet/config
    restart: on-failure
    ports: ["127.0.0.1:7177:7070"]
    environment:
      DATABASE_URL: "postgres://hatchet:hatchet@obs_postgres:5432/hatchet"
      SERVER_MSGQUEUE_KIND: postgres
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_INSECURE: "t"
    volumes: [obs_hatchet_certs:/hatchet/certs, obs_hatchet_config:/hatchet/config]
    depends_on:
      obs_hatchet_config: {condition: service_completed_successfully}

  obs_hatchet_dashboard:   # Hatchet UI: http://localhost:8180 (login admin@example.com / Admin123!!)
    image: ghcr.io/hatchet-dev/hatchet/hatchet-dashboard:latest
    command: sh ./entrypoint.sh --config /hatchet/config
    restart: on-failure
    ports: ["127.0.0.1:8180:80"]
    environment:
      DATABASE_URL: "postgres://hatchet:hatchet@obs_postgres:5432/hatchet"
    volumes: [obs_hatchet_certs:/hatchet/certs, obs_hatchet_config:/hatchet/config]
    depends_on:
      obs_hatchet_config: {condition: service_completed_successfully}

  obs_hatchet_token:   # mints an API token once into a shared volume; the worker reads it at startup
    image: ghcr.io/hatchet-dev/hatchet/hatchet-admin:latest
    entrypoint: >
      /bin/sh -c "
      if [ -s /hatchet-token/token ]; then echo 'hatchet token present'; exit 0; fi;
      /hatchet/hatchet-admin token create --config /hatchet/config --name observatory --expiresIn 8760h > /hatchet-token/token.tmp
      && mv /hatchet-token/token.tmp /hatchet-token/token && chmod 644 /hatchet-token/token && echo 'hatchet token written';
      "
    environment:
      DATABASE_URL: "postgres://hatchet:hatchet@obs_postgres:5432/hatchet"
      SERVER_MSGQUEUE_KIND: postgres
    volumes: [obs_hatchet_certs:/hatchet/certs, obs_hatchet_config:/hatchet/config, obs_hatchet_token:/hatchet-token]
    depends_on:
      obs_hatchet_config: {condition: service_completed_successfully}

  # ------------------------------------------------------------------ Langfuse (profile: langfuse)
  obs_langfuse_db:
    profiles: ["langfuse"]
    image: postgres:15.6
    environment: [PGPASSWORD=hatchet]
    entrypoint: >
      /bin/sh -c "
      psql -h obs_postgres -U hatchet -d hatchet -tc \"select 1 from pg_database where datname='langfuse'\" | grep -q 1 || psql -h obs_postgres -U hatchet -d hatchet -c \"create database langfuse\";
      echo langfuse db ready;
      "
    depends_on:
      obs_postgres: {condition: service_healthy}

  obs_minio:
    profiles: ["langfuse"]
    image: minio/minio:latest
    command: server /data
    restart: unless-stopped
    environment: [MINIO_ROOT_USER=minioadmin, MINIO_ROOT_PASSWORD=minioadmin]
    volumes: [obs_minio_data:/data]
    networks:
      default:
        aliases: [obs-minio]   # S3 SDK rejects hostnames with underscores

  obs_minio_init:
    profiles: ["langfuse"]
    image: minio/mc:latest
    depends_on: [obs_minio]
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://obs-minio:9000 minioadmin minioadmin) do sleep 1; done;
      mc mb --ignore-existing local/langfuse; echo bucket ready;
      "

  obs_clickhouse:
    profiles: ["langfuse"]
    image: clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    user: "101:101"
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=clickhouse
      - CLICKHOUSE_PASSWORD=${OBS_CLICKHOUSE_PASSWORD:-}
    volumes:
      - obs_clickhouse_data:/var/lib/clickhouse
      - ./examples/deepagents-hatchet/docker/clickhouse-low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
    mem_limit: 3g
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  obs_langfuse_redis:
    profiles: ["langfuse"]
    image: redis:7.2.4
    restart: unless-stopped
    command: redis-server --requirepass ${OBS_LANGFUSE_REDIS_AUTH:-} --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${OBS_LANGFUSE_REDIS_AUTH:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  obs_langfuse_worker:
    profiles: ["langfuse"]
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    restart: unless-stopped
    environment: &obs-langfuse-env
      DATABASE_URL: postgresql://hatchet:hatchet@obs_postgres:5432/langfuse
      SALT: ${OBS_SALT:-}
      ENCRYPTION_KEY: ${OBS_ENCRYPTION_KEY:-}
      NEXTAUTH_URL: http://localhost:3100
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://obs_clickhouse:9000
      CLICKHOUSE_URL: http://obs_clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${OBS_CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: obs_langfuse_redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${OBS_LANGFUSE_REDIS_AUTH:-}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minioadmin
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: minioadmin
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://obs-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minioadmin
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: minioadmin
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://obs-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
    depends_on: &obs-langfuse-deps
      obs_postgres: {condition: service_healthy}
      obs_clickhouse: {condition: service_healthy}
      obs_langfuse_redis: {condition: service_healthy}
      obs_langfuse_db: {condition: service_completed_successfully}
      obs_minio: {condition: service_started}

  obs_langfuse_web:   # Langfuse UI: http://localhost:3100 (admin@observatory.local / OBS_LANGFUSE_PASSWORD)
    profiles: ["langfuse"]
    image: docker.langfuse.com/langfuse/langfuse:4
    restart: unless-stopped
    ports: ["127.0.0.1:3100:3000"]
    environment:
      <<: *obs-langfuse-env
      NEXTAUTH_SECRET: ${OBS_NEXTAUTH_SECRET:-}
      LANGFUSE_INIT_ORG_ID: observatory
      LANGFUSE_INIT_ORG_NAME: observatory
      LANGFUSE_INIT_PROJECT_ID: observatory
      LANGFUSE_INIT_PROJECT_NAME: agent-observatory
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${OBS_LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${OBS_LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: admin@observatory.local
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${OBS_LANGFUSE_PASSWORD:-}
    depends_on: *obs-langfuse-deps

volumes:
  falkordb_data:
    name: falkordb_data
  obs_postgres_data:
  obs_hatchet_config:
  obs_hatchet_certs:
  obs_hatchet_token:
  obs_minio_data:
  obs_clickhouse_data:
