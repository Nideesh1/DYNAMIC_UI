# CI on pushes/PRs: typecheck + build the UI, test + build the Python package. No secrets used.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build:app
          npm run build:lib
      - name: Python (uv workspace at repo root)
        run: |
          uv sync --all-packages --frozen
          uv run --package agentglow pytest backend/tests -q
          uv run --package agentglow-example-deepagents-hatchet --directory examples/deepagents-hatchet python -c "import app.tools, app.demo_graph"
          uv run --package agentglow-example-quickstart python -c "import deepagents, langchain_openai, langchain_anthropic"
          uv run --package agentglow-example-langgraph python -c "import langgraph, langchain_openai, langchain_anthropic"
          uv run --package agentglow-example-openai-agents python -c "import agents, openinference.instrumentation.openai_agents"
          uv run --package agentglow-example-custom-loop --directory examples/custom-loop python -c "import ast; ast.parse(open('main.py').read()); import agentglow; agentglow.run, agentglow.traced_tool"
          uv build --package agentglow --out-dir dist
