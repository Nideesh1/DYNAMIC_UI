[project]
name = "agentglow-example-deepagents-hatchet"
version = "0.1.0"
description = "Hatchet + deepagents + MCP + FalkorDB, visualized live by AgentGlow through OpenTelemetry only"
requires-python = ">=3.11"
dependencies = [
  "agentglow[langchain,hatchet,fastapi,faststream,redis,postgres,mcp]",  # + backend services (trading desk flagship)
  "deepagents",
  "hatchet-sdk[otel]",
  "langchain",
  "langchain-google-genai",
  "langchain-openai",
  "langchain-anthropic",
  "langchain-aws[openai,anthropic]>=1.7.9",  # Bedrock Mantle: bedrock_mantle_openai: / bedrock_mantle_anthropic: specs
  "langchain-typesafe==0.0.1a3",  # TypeSafe Jev decisions (app/decide.py); used only when TYPESAFE_API_KEY is set
  "langchain-mcp-adapters",
  "mcp",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-http",
  "openinference-instrumentation-langchain",
  "openinference-instrumentation-mcp",
  "falkordb",
  "fastapi",
  "uvicorn",
  "httpx",
  "faststream[redis]>=0.5",
  "redis>=5",
  "asyncpg",
  "python-dotenv",
]

[tool.uv]
package = false

[tool.uv.sources]
agentglow = { workspace = true }
