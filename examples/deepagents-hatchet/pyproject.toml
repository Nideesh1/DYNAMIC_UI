[project]
name = "cb6-observatory"
version = "0.1.0"
description = "Live agent observatory: Hatchet + deepagents + Langfuse + FalkorDB + MCP, streamed to the 3D scenes"
requires-python = ">=3.11"
dependencies = [
  "deepagents",
  "hatchet-sdk[otel]",
  "langchain-google-genai",
  "langchain-mcp-adapters",
  "mcp",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-http",
  "openinference-instrumentation-langchain",
  "falkordb",
  "rapidfuzz",
  "fastapi",
  "uvicorn[standard]",
  "httpx",
  "python-dotenv",
]
